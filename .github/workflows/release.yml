name: Publish npm release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Require tag and package version to match
        run: |
          node --input-type=module --eval 'import p from "./package.json" with { type: "json" }; if (`v${p.version}` !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - name: Skip if this version is already on the registry
        id: registry
        run: |
          spec=$(node --input-type=module --eval 'import p from "./package.json" with { type: "json" }; process.stdout.write(`${p.name}@${p.version}`)')
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$spec is already published; skipping build, publish, and upload."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify and build release tarball
        id: pack
        if: steps.registry.outputs.published == 'false'
        run: npm run check && node scripts/package-release.mjs
      - name: Publish with npm provenance
        if: steps.registry.outputs.published == 'false'
        run: npm publish "${{ steps.pack.outputs.filename }}" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach tarball and SHA-256 checksum
        if: steps.registry.outputs.published == 'false'
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.filename }}" "${{ steps.pack.outputs.checksum_file }}"
        env:
          GH_TOKEN: ${{ github.token }}

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # `engines` claims Node >= 20.11, and the runtime the VPS installer pins is
    # 22.18.0. Both are claims about the published artifact, so both are run.
    # 20.11.0 is the exact floor: a dependency or syntax that needs more than it
    # must fail here rather than in an operator's install.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.11.0", "22.18.0", "24.x"]
    name: verify (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The suite generates and inspects real SSH key material and real Git
      # repositories, so it fails with a bare ENOENT on a host without them.
      # Naming the requirement here keeps that failure legible.
      - name: Require the toolchain the suite shells out to
        run: |
          set -Eeuo pipefail
          for tool in git ssh-keygen openssl; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is required to run the DeployKit test suite"; exit 1; }
          done
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run --json

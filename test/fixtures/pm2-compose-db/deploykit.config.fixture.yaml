apiVersion: deploykit/config/v1alpha1
kind: Deployment

project:
  name: pm2-compose-db
  repository: deploykit-fixtures/pm2-compose-db
  ref: main

target:
  name: production
  githubEnvironment: fixture-pm2-production
  primaryDomain: pm2.example.test
  aliases: []

server:
  host: vps.pm2.example.test
  user: ubuntu
  port: 22
  identityFile: /home/deploykit-fixture/.ssh/pm2-production
  hostKeyFingerprint: SHA256:xSukO82IiFhS0Gkn97WaVYoDmGu7rAVt8ioCme1SK/E
  configureFirewall: false

compose:
  files:
    - compose.yaml

services:
  api:
    type: pm2
    role: api
    workingDirectory: api
    nodeVersion: 22.18.0
    packageManager: pnpm
    buildScript: build
    startScript: start
    portEnvironmentVariable: PORT
    hostPort: auto
    healthCheck:
      type: http
      path: /health
  ssr:
    type: pm2
    role: ssr
    workingDirectory: web
    nodeVersion: 22.18.0
    packageManager: yarn
    buildScript: build
    startScript: start
    portEnvironmentVariable: PORT
    hostPort: auto
    healthCheck:
      type: http
      path: /health
  worker:
    type: pm2
    role: worker
    workingDirectory: worker
    nodeVersion: 22.18.0
    packageManager: bun
    startScript: start
    healthCheck:
      type: command
      command:
        - bun
        - run
        - health

frontend:
  type: service
  service: ssr

routes:
  - hostname: "@primary"
    path: /api/
    match: prefix
    target: api
    preservePrefix: true
    sse: true

database:
  type: compose
  service: postgres
  internalPort: 5432
  consumers:
    - api
    - ssr
    - worker
  volume: postgres-data
  credentials:
    username: fixture_app
    database: fixture_app
    passwordSecret: POSTGRES_PASSWORD
    connectionStringSecret: DATABASE_URL
    connectionStringTemplate: postgresql://{username}:{password}@{host}:{port}/{database}
  migrations:
    service: api
    command:
      - pnpm
      - run
      - migrate
  seed:
    service: api
    command:
      - pnpm
      - run
      - seed

environment:
  frontend:
    PUBLIC_API_BASE_URL: "/api"
  backend:
    CERTBOT_EMAIL: "pm2-fixture-ops@pm2.example.test"
    LOG_LEVEL: "fixture"
  generated:
    - DATABASE_URL
    - POSTGRES_PASSWORD
